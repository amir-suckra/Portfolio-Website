<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>BlockBreak</title>
  <!-- Game: sketch.js by Amir Suckra (github.com/amir-suckra/BlockBreak), unmodified.
       Library: p5.js v1.11.11 (LGPL-2.1), https://p5js.org -->
  <style>
    html, body { margin: 0; height: 100%; background: #2b2b2b; overflow: hidden; }
    /* Phones: let every touch go to the game instead of scrolling, zooming, selecting, or opening menus */
    html, body, main, canvas { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; width: 100% !important; height: auto !important; max-height: 100vh; max-width: calc(100vh * 1.6); }
  </style>
  <script src="p5.min.js"></script>
</head>
<body>
  <main></main>
  <script src="sketch.js?v=2"></script>
  <script>
    // Keep arrow keys from scrolling the portfolio page while the game has focus.
    window.addEventListener('keydown', function (e) {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].indexOf(e.key) !== -1) e.preventDefault();
    });
    window.addEventListener('pointerdown', function () { window.focus(); });
  </script>
</body>
</html>
